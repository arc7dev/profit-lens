name: Build sync

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-check:
    name: build/ in sync with src/
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy fonts
        run: npm run fonts

      - name: Build
        run: npm run build

      - name: Verify build/ matches committed output
        run: |
          if [ -n "$(git status --porcelain build/)" ]; then
            echo "❌  build/ is out of sync with src/."
            echo "Run 'npm run build' locally and commit the updated build/ together with your src/ changes."
            echo ""
            git status build/
            exit 1
          fi
          echo "✅  build/ matches the committed output."
